<svg
  width="400"
  height="400"
  viewBox="0 0 400 400"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF" />
      <stop offset="1" stop-color="#7B61FF" />
    </linearGradient>
    <radialGradient id="shine" cx="25%" cy="25%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="88" fill="url(#bg)" />
  <rect width="400" height="400" rx="88" fill="url(#shine)" />

  <!-- "tklogics" — one line, bold, vertically centered -->
  <text
    x="200"
    y="232"
    font-family="system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="68"
    letter-spacing="-2"
    fill="white"
    text-anchor="middle"
  >tklogics</text>
</svg>
